    <meta property="og:site_name" content="Monocart Reporter">

    <meta name="twitter:card" content="summary_large_image">

    <style>
    @keyframes fs-loading-animation {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .fs-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 100;
        width: 50px;
        height: 50px;
        margin-top: -25px;
        margin-left: -25px;
        animation: 0.382s fs-loading-animation linear infinite;
    }

    .fs-loading svg {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    </style>
</head>
<body>
<div class="fs-loading">
    <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 16 16">
        <path d="M1,8 A7 7 0 1 1 8 15" stroke="#999" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
</div>
{content}
</body>
</html>
